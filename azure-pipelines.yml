parameters:
  - name: avdSubServiceConnection
    type: string
    default: "cloudfitonline_avd_deployer"
  - name: avdSubscriptionId
    type: string
    default: "64774875-a7d4-46d8-9906-30cdc05f5bac"
stages:
  - stage: whatif
    displayName: Deployment - What If?
    pool: 
      vmImage: ubuntu-latest

    jobs:
      - job: whatifJob
        displayName: WWADOD?
        steps:
            - checkout: self



            - task: AzureCLI@2
              displayName: "a la carte"
              inputs:
                  azureSubscription: ${{ parameters.avdSubServiceConnection }} 
                  scriptType: 'bash'
                  scriptLocation: 'inlineScript'
                  inlineScript: |
                    az account set -s ${{ parameters.avdSubscriptionId }};
                    # az vm delete -y --ids $(az vm list -g cfoavd-rg-cfsgaia-prod --query "[].id" -o tsv)
                    # az group create -l USGovVirginia -n rg-cfoavd-company1-prod
                    # az network vnet create -g rg-cfoavd-company1-prod -n vnet-cfoavd-company1-prod --address-prefixes 10.2.0.0/19 \
                    # --subnet-name snet-cfoavd-company1-prod --subnet-prefixes 10.2.0.0/25
                    az network vnet peering create -g cfo-rg-hub-mlz -n peer-cfo-rg-hub-mlz-to-vnet-cfoavd-company1-prod --vnet-name cfo-vnet-hub-mlz --remote-vnet vnet-cfoavd-company1-prod --allow-vnet-access

