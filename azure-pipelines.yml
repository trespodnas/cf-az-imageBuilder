parameters:
  - name: avdSubServiceConnection
    type: string
    default: "cloudfitonline_avd_deployer"
  - name: imageGalleryResourceGroupName
    type: string
    default: 'cfoavd-rg-cfsgaia-prod'
trigger:
- main
pool:
  vmImage: ubuntu-latest
stages:
  - stage: runPacker
    jobs:
      - job: createImage
        steps:
          - task: PackerTool@0
            displayName: 'use latest packer'
          - task: Packer@1
            displayName: 'packer init'
            inputs:
              connectedServiceType: azure
              azureSubscription: ${{ parameters.avdSubServiceConnection }}
              templatePath: $(Build.SourcesDirectory)/avd_win11_stig_fslogix.pkr.hcl
              command: init
          - task: Packer@1
            displayName: 'packer validate'
            inputs:
              connectedServiceType: azure
              azureSubscription: ${{ parameters.avdSubServiceConnection }}
              templatePath: $(Build.SourcesDirectory)/avd_win11_stig_fslogix.pkr.hcl
              command: validate