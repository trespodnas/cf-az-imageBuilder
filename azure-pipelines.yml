parameters:
  - name: avdSubServiceConnection
    type: string
    default: "cloudfitonline_avd_deployer"
stages:
  - stage: whatif
    displayName: Deployment - What If?
    pool: 
      vmImage: ubuntu-latest

    jobs:
      - job: whatifJob
        displayName: WWADOD?
        steps:
            - checkout: self



            - task: AzureCLI@2
              displayName: "a la carte"
              inputs:
                  azureSubscription: ${{ parameters.avdSubServiceConnection }}
                  scriptType: 'bash'
                  scriptLocation: 'inlineScript'
                  inlineScript: |
                    az keyvault create --location USGovVirginia --name kv-cfsgaia-prod \
                    --resource-group cfoavd-rg-cfsgaia-prod --enable-purge-protection \
                    --enabled-for-deployment --enabled-for-template-deployment

